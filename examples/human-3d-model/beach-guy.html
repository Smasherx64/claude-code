<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Modelo 3D – Beach Guy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #87CEEB; overflow: hidden; font-family: -apple-system, sans-serif;
           touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; }

    /* Info bar – hidden on very small screens */
    #info {
      position: fixed; bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.45); color: #eee;
      padding: 10px 18px; border-radius: 20px;
      font-size: clamp(11px, 3vw, 13px); pointer-events: none;
      white-space: nowrap;
    }
    @media (max-width: 400px) { #info { font-size: 10px; padding: 8px 12px; } }

    /* Controls – bottom row on mobile, right column on desktop */
    #controls {
      position: fixed;
      display: flex; gap: 10px;
    }
    @media (max-width: 600px) {
      #controls {
        bottom: max(72px, calc(env(safe-area-inset-bottom) + 60px));
        left: 50%; transform: translateX(-50%);
        flex-direction: row; justify-content: center;
      }
    }
    @media (min-width: 601px) {
      #controls { top: 20px; right: 20px; flex-direction: column; }
    }

    .ctrl-btn {
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.35);
      color: #fff; border-radius: 12px; cursor: pointer;
      font-size: clamp(12px, 3.5vw, 14px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      transition: background 0.2s;
      /* Large touch targets */
      padding: clamp(10px, 2.5vw, 10px) clamp(14px, 4vw, 18px);
      min-height: 44px; min-width: 44px;
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
    }
    .ctrl-btn:hover, .ctrl-btn:active { background: rgba(0,0,0,0.55); }
  </style>
</head>
<body>
<div id="canvas-container"></div>
<div id="info" id="info-bar">
  <span class="desktop-hint">Arraste para girar &nbsp;|&nbsp; Scroll para zoom</span>
  <span class="mobile-hint">1 dedo: girar &nbsp;|&nbsp; 2 dedos: zoom</span>
</div>
<style>
  .desktop-hint { display: none; }
  .mobile-hint  { display: inline; }
  @media (hover: hover) and (pointer: fine) {
    .desktop-hint { display: inline; }
    .mobile-hint  { display: none; }
  }
</style>
<div id="controls">
  <button class="ctrl-btn" id="btn-reset">Resetar Câmera</button>
  <button class="ctrl-btn" id="btn-wire">Wireframe</button>
  <button class="ctrl-btn" id="btn-spin">Auto-Rotação</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 600;
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 10, 30);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 60);
camera.position.set(0, 1.1, 4.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.2;
controls.maxDistance = 12;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.update();

// ── Lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff5e0, 0.55));

const sun = new THREE.DirectionalLight(0xfff8d0, 2.2);
sun.position.set(5, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 25;
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3;
sun.shadow.camera.top = 4;   sun.shadow.camera.bottom = -2;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xadd8f7, 0.7);
fill.position.set(-4, 3, 2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd580, 0.5);
rim.position.set(1, 2, -5);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0x87CEEB, 0xf5deb3, 0.5));

// ── Materials ─────────────────────────────────────────────────────────────────
const skinMat   = new THREE.MeshStandardMaterial({ color: 0x3d1f0f, roughness: 0.75, metalness: 0.0 });
const shortsMat = new THREE.MeshStandardMaterial({ color: 0x2a2d3a, roughness: 0.85, metalness: 0.0 });
const glassMat  = new THREE.MeshStandardMaterial({ color: 0x00bfff, roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.7 });
const frameMat  = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3, metalness: 0.8 });
const chainMat  = new THREE.MeshStandardMaterial({ color: 0xddddaa, roughness: 0.2, metalness: 0.9 });
const hairMat   = new THREE.MeshStandardMaterial({ color: 0x0d0903, roughness: 0.95, metalness: 0.0 });
const sandMat   = new THREE.MeshStandardMaterial({ color: 0xe8d5a3, roughness: 1.0, metalness: 0.0 });

// ── Helper builders ───────────────────────────────────────────────────────────
function capsuleGeo(rx, length, rz, pos, rot) {
  const capR = Math.min(rx, rz);
  const bodyLen = Math.max(length - 2 * capR, 0.001);
  const g = new THREE.CapsuleGeometry(capR, bodyLen, 6, 16);
  g.scale(rx / capR, 1, rz / capR);
  if (rot) { g.rotateX(rot[0]||0); g.rotateY(rot[1]||0); g.rotateZ(rot[2]||0); }
  g.translate(pos[0], pos[1], pos[2]);
  return g;
}
function sphereGeo(rx, ry, rz, pos) {
  const g = new THREE.SphereGeometry(rx, 20, 20);
  g.scale(1, ry/rx, rz/rx);
  g.translate(pos[0], pos[1], pos[2]);
  return g;
}
function mesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// ── CHARACTER GROUP ───────────────────────────────────────────────────────────
const character = new THREE.Group();
scene.add(character);

// ─── BODY (skin) ─────────────────────────────────────────────────────────────
const skinParts = [];

// Head – cranium
skinParts.push(sphereGeo(0.118, 0.132, 0.116, [0, 1.82, 0]));
// Face
const faceG = new THREE.SphereGeometry(0.096, 16, 16);
faceG.scale(1, 1.05, 0.80); faceG.translate(0, 1.775, 0.038);
skinParts.push(faceG);
// Jaw
skinParts.push(sphereGeo(0.086, 0.074, 0.082, [0, 1.692, 0.012]));
// Neck
skinParts.push(capsuleGeo(0.040, 0.13, 0.040, [0, 1.60, 0.005], null));

// Torso – athletic / wider chest
const chestG = new THREE.CylinderGeometry(0.195, 0.150, 0.30, 22, 1);
chestG.scale(1, 1, 1.18); chestG.translate(0, 1.39, 0.005);
skinParts.push(chestG);
const abdG = new THREE.CylinderGeometry(0.150, 0.135, 0.22, 22, 1);
abdG.scale(1, 1, 1.04); abdG.translate(0, 1.14, 0);
skinParts.push(abdG);
// Waist/pelvis exposed above shorts (shorts start ~0.82)
const waistG = new THREE.CylinderGeometry(0.138, 0.155, 0.12, 22, 1);
waistG.scale(1, 1, 0.94); waistG.translate(0, 0.98, 0);
skinParts.push(waistG);

// Shoulder caps
for (const s of [-1, 1]) skinParts.push(sphereGeo(0.078, 0.075, 0.075, [s*0.238, 1.505, 0]));

// Upper arms
for (const s of [-1, 1])
  skinParts.push(capsuleGeo(0.055, 0.30, 0.052, [s*0.385, 1.385, 0], [0, 0, s*Math.PI/2]));
// Elbows
for (const s of [-1, 1]) skinParts.push(sphereGeo(0.050, 0.050, 0.047, [s*0.570, 1.385, 0]));
// Forearms
for (const s of [-1, 1])
  skinParts.push(capsuleGeo(0.040, 0.26, 0.038, [s*0.735, 1.385, 0], [0, 0, s*Math.PI/2]));
// Wrists
for (const s of [-1, 1]) skinParts.push(sphereGeo(0.034, 0.034, 0.029, [s*0.885, 1.385, 0]));
// Hands
for (const s of [-1, 1]) {
  const palmG = new THREE.BoxGeometry(0.072, 0.026, 0.092);
  palmG.translate(s*0.948, 1.380, 0.005); skinParts.push(palmG);
  for (let f = 0; f < 4; f++) {
    skinParts.push(capsuleGeo(0.009, 0.055, 0.009,
      [s*0.995, 1.380, -0.030 + f*0.020], [0, 0, s*Math.PI/2]));
  }
  skinParts.push(capsuleGeo(0.011, 0.038, 0.011,
    [s*0.948, 1.350, -0.053], [s*0.4, 0, s*Math.PI/2 + s*0.3]));
}

// Upper legs (above shorts bottom ~0.46)
for (const s of [-1, 1])
  skinParts.push(capsuleGeo(0.068, 0.22, 0.065, [s*0.118, 0.56, 0], null));
// Lower legs
for (const s of [-1, 1])
  skinParts.push(capsuleGeo(0.057, 0.36, 0.054, [s*0.118, 0.14, 0], null));
// Ankles
for (const s of [-1, 1]) skinParts.push(sphereGeo(0.044, 0.040, 0.040, [s*0.118, -0.055, 0.012]));
// Feet
for (const s of [-1, 1]) {
  const fG = new THREE.BoxGeometry(0.070, 0.044, 0.160);
  fG.translate(s*0.118, -0.082, 0.050); skinParts.push(fG);
  skinParts.push(sphereGeo(0.040, 0.030, 0.034, [s*0.118, -0.076, 0.122]));
}

const skinGeo = mergeGeometries(skinParts);
skinGeo.computeVertexNormals();
character.add(mesh(skinGeo, skinMat));

// ─── SHORTS ───────────────────────────────────────────────────────────────────
const shortsParts = [];
// Waistband area
const wbG = new THREE.CylinderGeometry(0.162, 0.160, 0.04, 22, 1);
wbG.scale(1,1,0.93); wbG.translate(0, 0.885, 0);
shortsParts.push(wbG);
// Left leg short
shortsParts.push(capsuleGeo(0.092, 0.42, 0.088, [-0.118, 0.72, 0], null));
// Right leg short
shortsParts.push(capsuleGeo(0.092, 0.42, 0.088, [0.118, 0.72, 0], null));
// Center fill
const cfG = new THREE.CylinderGeometry(0.095, 0.075, 0.38, 22, 1);
cfG.scale(1,1,0.92); cfG.translate(0, 0.73, 0);
shortsParts.push(cfG);

const shortsGeo = mergeGeometries(shortsParts);
shortsGeo.computeVertexNormals();
character.add(mesh(shortsGeo, shortsMat));

// ─── HAIR (curly afro-style) ──────────────────────────────────────────────────
const hairParts = [];
// Base dome
const hBase = new THREE.SphereGeometry(0.125, 16, 16);
hBase.scale(1, 0.72, 1); hBase.translate(0, 1.88, 0);
hairParts.push(hBase);
// Curly bumps scattered on top
const bumpPositions = [
  [0,1.96,0],[0.07,1.95,0.04],[-0.07,1.95,0.04],
  [0.04,1.95,-0.07],[-0.04,1.95,-0.07],
  [0.10,1.90,0],[-0.10,1.90,0],[0,1.90,0.09],[0,1.90,-0.09],
  [0.08,1.93,-0.06],[-0.08,1.93,-0.06],[0.06,1.93,0.08],[-0.06,1.93,0.08],
];
for (const p of bumpPositions) {
  const bg = new THREE.SphereGeometry(0.032, 8, 8);
  bg.translate(p[0], p[1], p[2]); hairParts.push(bg);
}
const hairGeo = mergeGeometries(hairParts);
hairGeo.computeVertexNormals();
character.add(mesh(hairGeo, hairMat));

// ─── SUNGLASSES ───────────────────────────────────────────────────────────────
// Lenses (two thin ellipsoid disks)
for (const s of [-1, 1]) {
  const lensG = new THREE.CylinderGeometry(0.038, 0.038, 0.007, 12, 1);
  lensG.rotateX(Math.PI / 2);
  lensG.scale(1.3, 1, 0.8);
  lensG.translate(s * 0.048, 1.790, 0.108);
  character.add(mesh(lensG, glassMat));

  // Lens frame
  const frameG = new THREE.TorusGeometry(0.040, 0.005, 8, 20);
  frameG.rotateX(Math.PI / 2);
  frameG.scale(1.3, 1, 0.8);
  frameG.translate(s * 0.048, 1.790, 0.108);
  character.add(mesh(frameG, frameMat));
}
// Bridge
const bridgeG = new THREE.CylinderGeometry(0.003, 0.003, 0.022, 6);
bridgeG.rotateZ(Math.PI / 2);
bridgeG.translate(0, 1.790, 0.110);
character.add(mesh(bridgeG, frameMat));
// Temples (arms going to ears)
for (const s of [-1, 1]) {
  const tmG = new THREE.CylinderGeometry(0.003, 0.003, 0.095, 6);
  tmG.rotateZ(Math.PI / 2);
  tmG.translate(s * 0.135, 1.790, 0.095);
  character.add(mesh(tmG, frameMat));
}

// ─── NECKLACE (chain) ────────────────────────────────────────────────────────
const neckR = 0.058;
const chainSegs = 24;
for (let i = 0; i < chainSegs; i++) {
  const angle = (i / chainSegs) * Math.PI * 2;
  const x = Math.sin(angle) * neckR;
  const z = Math.cos(angle) * neckR * 0.85;
  const y = 1.595 - Math.abs(Math.sin(angle)) * 0.015;
  const linkG = new THREE.SphereGeometry(0.005, 6, 6);
  linkG.translate(x, y, z);
  character.add(mesh(linkG, chainMat));
}
// Pendant
const pendG = new THREE.SphereGeometry(0.012, 8, 8);
pendG.translate(0, 1.540, 0.055);
character.add(mesh(pendG, chainMat));

// ─── GROUND (sand) ───────────────────────────────────────────────────────────
const sandGeo = new THREE.PlaneGeometry(18, 18, 30, 30);
// Subtle undulation
const posAttr = sandGeo.attributes.position;
for (let i = 0; i < posAttr.count; i++) {
  posAttr.setZ(i, posAttr.getZ(i) + (Math.random() - 0.5) * 0.015);
}
sandGeo.computeVertexNormals();
const sand = new THREE.Mesh(sandGeo, sandMat);
sand.rotation.x = -Math.PI / 2;
sand.position.y = -0.125;
sand.receiveShadow = true;
scene.add(sand);

// Shadow overlay
const shadowGeo = new THREE.PlaneGeometry(10, 10);
const shadowMat = new THREE.ShadowMaterial({ opacity: 0.30 });
const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -0.124;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

// ─── OCEAN hint (far background) ─────────────────────────────────────────────
const seaGeo = new THREE.PlaneGeometry(30, 10);
const seaMat = new THREE.MeshStandardMaterial({ color: 0x1a7fad, roughness: 0.15, metalness: 0.1 });
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.rotation.x = -Math.PI / 2;
sea.position.set(0, -0.05, -8);
scene.add(sea);

// ── UI Controls ────────────────────────────────────────────────────────────────
let wireframe = false, autoSpin = false;

document.getElementById('btn-wire').addEventListener('click', () => {
  wireframe = !wireframe;
  [skinMat, shortsMat, glassMat, frameMat, chainMat, hairMat].forEach(m => m.wireframe = wireframe);
  document.getElementById('btn-wire').textContent = wireframe ? 'Sólido' : 'Wireframe';
});

document.getElementById('btn-spin').addEventListener('click', () => {
  autoSpin = !autoSpin;
  document.getElementById('btn-spin').textContent = autoSpin ? 'Parar Rotação' : 'Auto-Rotação';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.set(0, 1.1, 4.5);
  controls.target.set(0, 0.95, 0);
  controls.update();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Render loop ────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (autoSpin) character.rotation.y += 0.008;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
