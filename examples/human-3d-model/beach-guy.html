<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Modelo 3D – Beach Guy</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background:#87CEEB; overflow:hidden; font-family:-apple-system,sans-serif; touch-action:none; }
    canvas { display:block; }
    #info {
      position:fixed; bottom:max(20px,env(safe-area-inset-bottom));
      left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.45); color:#eee;
      padding:10px 18px; border-radius:20px;
      font-size:clamp(11px,3vw,13px); pointer-events:none; white-space:nowrap;
    }
    #controls {
      position:fixed; display:flex; gap:10px;
    }
    @media (max-width:600px) {
      #controls {
        bottom:max(72px,calc(env(safe-area-inset-bottom)+60px));
        left:50%; transform:translateX(-50%); flex-direction:row;
      }
    }
    @media (min-width:601px) {
      #controls { top:20px; right:20px; flex-direction:column; }
    }
    .ctrl-btn {
      background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.35);
      color:#fff; border-radius:12px; cursor:pointer;
      font-size:clamp(12px,3.5vw,14px); text-shadow:0 1px 3px rgba(0,0,0,0.5);
      transition:background 0.2s;
      padding:clamp(10px,2.5vw,10px) clamp(14px,4vw,18px);
      min-height:44px; min-width:44px;
      display:flex; align-items:center; justify-content:center;
      -webkit-user-select:none; user-select:none;
    }
    .ctrl-btn:active { background:rgba(0,0,0,0.6); }
  </style>
</head>
<body>
<div id="info">
  <span id="hint-desktop" style="display:none">Arraste para girar &nbsp;|&nbsp; Scroll para zoom</span>
  <span id="hint-mobile">1 dedo: girar &nbsp;|&nbsp; 2 dedos: zoom</span>
</div>
<div id="controls">
  <button class="ctrl-btn" id="btn-reset">Resetar</button>
  <button class="ctrl-btn" id="btn-wire">Wireframe</button>
  <button class="ctrl-btn" id="btn-spin">Girar Auto</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ── Hint ──────────────────────────────────────────────────────────────────────
if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
  document.getElementById('hint-desktop').style.display = 'inline';
  document.getElementById('hint-mobile').style.display  = 'none';
}

// ── Renderer ──────────────────────────────────────────────────────────────────
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 600;
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement, document.getElementById('info'));

// ── Scene / Camera ────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 10, 30);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.01, 60);
camera.position.set(0, 1.1, 4.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping  = true;
controls.dampingFactor  = 0.07;
controls.minDistance    = 1.2;
controls.maxDistance    = 12;
controls.touches        = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.update();

// ── Lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff5e0, 0.55));

const sun = new THREE.DirectionalLight(0xfff8d0, 2.2);
sun.position.set(5, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 25;
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3;
sun.shadow.camera.top  = 4;  sun.shadow.camera.bottom = -2;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xadd8f7, 0.7);
fill.position.set(-4, 3, 2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd580, 0.5);
rim.position.set(1, 2, -5);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0x87CEEB, 0xf5deb3, 0.5));

// ── Materials ─────────────────────────────────────────────────────────────────
const skinMat   = new THREE.MeshStandardMaterial({ color:0x3d1f0f, roughness:0.75 });
const shortsMat = new THREE.MeshStandardMaterial({ color:0x2a2d3a, roughness:0.85 });
const glassMat  = new THREE.MeshStandardMaterial({ color:0x00bfff, roughness:0.05, metalness:0.9, transparent:true, opacity:0.7 });
const frameMat  = new THREE.MeshStandardMaterial({ color:0xcccccc, roughness:0.3, metalness:0.8 });
const chainMat  = new THREE.MeshStandardMaterial({ color:0xddddaa, roughness:0.2, metalness:0.9 });
const hairMat   = new THREE.MeshStandardMaterial({ color:0x0d0903, roughness:0.95 });
const sandMat   = new THREE.MeshStandardMaterial({ color:0xe8d5a3, roughness:1.0 });
const seaMat    = new THREE.MeshStandardMaterial({ color:0x1a7fad, roughness:0.15, metalness:0.1 });

const allMats = [skinMat, shortsMat, glassMat, frameMat, chainMat, hairMat];

// ── Helpers ───────────────────────────────────────────────────────────────────
const character = new THREE.Group();
scene.add(character);

function addMesh(geo, mat, castShadow) {
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow  = castShadow !== false;
  m.receiveShadow = true;
  character.add(m);
  return m;
}

function cap(rx, length, rz, px, py, pz, rx2, ry2, rz2) {
  const capR    = Math.min(rx, rz);
  const bodyLen = Math.max(length - 2*capR, 0.001);
  const g = new THREE.CapsuleGeometry(capR, bodyLen, 6, 16);
  g.scale(rx/capR, 1, rz/capR);
  if (rx2) g.rotateX(rx2);
  if (ry2) g.rotateY(ry2);
  if (rz2) g.rotateZ(rz2);
  g.translate(px, py, pz);
  return g;
}

function sph(rx, ry, rz, px, py, pz) {
  const g = new THREE.SphereGeometry(rx, 18, 18);
  g.scale(1, ry/rx, rz/rx);
  g.translate(px, py, pz);
  return g;
}

// ── SKIN ─────────────────────────────────────────────────────────────────────
// Head
addMesh(sph(0.118, 0.132, 0.116,  0, 1.82, 0),       skinMat);
const faceG = new THREE.SphereGeometry(0.096,16,16); faceG.scale(1,1.05,0.80); faceG.translate(0,1.775,0.038);
addMesh(faceG, skinMat);
addMesh(sph(0.086, 0.074, 0.082,  0, 1.692, 0.012),  skinMat);
// Neck
addMesh(cap(0.040,0.13,0.040,  0,1.60,0.005),         skinMat);
// Torso
const chG = new THREE.CylinderGeometry(0.195,0.150,0.30,22,1); chG.scale(1,1,1.18); chG.translate(0,1.39,0.005);
addMesh(chG, skinMat);
const abG = new THREE.CylinderGeometry(0.150,0.135,0.22,22,1); abG.scale(1,1,1.04); abG.translate(0,1.14,0);
addMesh(abG, skinMat);
const wG  = new THREE.CylinderGeometry(0.138,0.155,0.12,22,1); wG.scale(1,1,0.94);  wG.translate(0,0.98,0);
addMesh(wG, skinMat);
// Shoulder caps
for (const s of [-1,1]) addMesh(sph(0.078,0.075,0.075, s*0.238,1.505,0), skinMat);
// Upper arms
for (const s of [-1,1]) addMesh(cap(0.055,0.30,0.052, s*0.385,1.385,0, 0,0,s*Math.PI/2), skinMat);
// Elbows
for (const s of [-1,1]) addMesh(sph(0.050,0.050,0.047, s*0.570,1.385,0), skinMat);
// Forearms
for (const s of [-1,1]) addMesh(cap(0.040,0.26,0.038, s*0.735,1.385,0, 0,0,s*Math.PI/2), skinMat);
// Wrists
for (const s of [-1,1]) addMesh(sph(0.034,0.034,0.029, s*0.885,1.385,0), skinMat);
// Hands
for (const s of [-1,1]) {
  const pG = new THREE.BoxGeometry(0.072,0.026,0.092); pG.translate(s*0.948,1.380,0.005);
  addMesh(pG, skinMat);
  for (let f=0;f<4;f++) addMesh(cap(0.009,0.055,0.009, s*0.995,1.380,-0.030+f*0.020, 0,0,s*Math.PI/2), skinMat);
  addMesh(cap(0.011,0.038,0.011, s*0.948,1.350,-0.053, s*0.4,0,s*Math.PI/2+s*0.3), skinMat);
}
// Upper legs
for (const s of [-1,1]) addMesh(cap(0.068,0.22,0.065, s*0.118,0.56,0), skinMat);
// Lower legs
for (const s of [-1,1]) addMesh(cap(0.057,0.36,0.054, s*0.118,0.14,0), skinMat);
// Ankles
for (const s of [-1,1]) addMesh(sph(0.044,0.040,0.040, s*0.118,-0.055,0.012), skinMat);
// Feet
for (const s of [-1,1]) {
  const fG = new THREE.BoxGeometry(0.070,0.044,0.160); fG.translate(s*0.118,-0.082,0.050);
  addMesh(fG, skinMat);
  addMesh(sph(0.040,0.030,0.034, s*0.118,-0.076,0.122), skinMat);
}

// ── SHORTS ───────────────────────────────────────────────────────────────────
const wbG = new THREE.CylinderGeometry(0.162,0.160,0.04,22,1); wbG.scale(1,1,0.93); wbG.translate(0,0.885,0);
addMesh(wbG, shortsMat);
for (const s of [-1,1]) addMesh(cap(0.092,0.42,0.088, s*0.118,0.72,0), shortsMat);
const cfG = new THREE.CylinderGeometry(0.095,0.075,0.38,22,1); cfG.scale(1,1,0.92); cfG.translate(0,0.73,0);
addMesh(cfG, shortsMat);

// ── HAIR (curly) ──────────────────────────────────────────────────────────────
const hbG = new THREE.SphereGeometry(0.125,16,16); hbG.scale(1,0.72,1); hbG.translate(0,1.88,0);
addMesh(hbG, hairMat);
const bumps = [[0,1.96,0],[0.07,1.95,0.04],[-0.07,1.95,0.04],[0.04,1.95,-0.07],[-0.04,1.95,-0.07],
  [0.10,1.90,0],[-0.10,1.90,0],[0,1.90,0.09],[0,1.90,-0.09],
  [0.08,1.93,-0.06],[-0.08,1.93,-0.06],[0.06,1.93,0.08],[-0.06,1.93,0.08]];
for (const p of bumps) { const bg = new THREE.SphereGeometry(0.032,8,8); bg.translate(p[0],p[1],p[2]); addMesh(bg, hairMat); }

// ── SUNGLASSES ────────────────────────────────────────────────────────────────
for (const s of [-1,1]) {
  const lG = new THREE.CylinderGeometry(0.038,0.038,0.007,12,1);
  lG.rotateX(Math.PI/2); lG.scale(1.3,1,0.8); lG.translate(s*0.048,1.790,0.108);
  addMesh(lG, glassMat);
  const frG = new THREE.TorusGeometry(0.040,0.005,8,20);
  frG.rotateX(Math.PI/2); frG.scale(1.3,1,0.8); frG.translate(s*0.048,1.790,0.108);
  addMesh(frG, frameMat);
}
const brG = new THREE.CylinderGeometry(0.003,0.003,0.022,6); brG.rotateZ(Math.PI/2); brG.translate(0,1.790,0.110);
addMesh(brG, frameMat);
for (const s of [-1,1]) {
  const tmG = new THREE.CylinderGeometry(0.003,0.003,0.095,6); tmG.rotateZ(Math.PI/2); tmG.translate(s*0.135,1.790,0.095);
  addMesh(tmG, frameMat);
}

// ── NECKLACE ──────────────────────────────────────────────────────────────────
for (let i=0;i<24;i++) {
  const a = (i/24)*Math.PI*2;
  const lkG = new THREE.SphereGeometry(0.005,6,6);
  lkG.translate(Math.sin(a)*0.058, 1.595-Math.abs(Math.sin(a))*0.015, Math.cos(a)*0.050);
  addMesh(lkG, chainMat);
}
const pendG = new THREE.SphereGeometry(0.012,8,8); pendG.translate(0,1.540,0.055);
addMesh(pendG, chainMat);

// ── SAND ─────────────────────────────────────────────────────────────────────
const sandGeo = new THREE.PlaneGeometry(18,18,30,30);
const pos = sandGeo.attributes.position;
for (let i=0;i<pos.count;i++) pos.setZ(i, pos.getZ(i)+(Math.random()-0.5)*0.015);
sandGeo.computeVertexNormals();
const sand = new THREE.Mesh(sandGeo, sandMat);
sand.rotation.x = -Math.PI/2; sand.position.y = -0.125; sand.receiveShadow = true;
scene.add(sand);

const shadowGeo = new THREE.PlaneGeometry(10,10);
const shadowMesh = new THREE.Mesh(shadowGeo, new THREE.ShadowMaterial({ opacity:0.28 }));
shadowMesh.rotation.x = -Math.PI/2; shadowMesh.position.y = -0.124; shadowMesh.receiveShadow = true;
scene.add(shadowMesh);

const sea = new THREE.Mesh(new THREE.PlaneGeometry(30,10), seaMat);
sea.rotation.x = -Math.PI/2; sea.position.set(0,-0.05,-8);
scene.add(sea);

// ── UI ────────────────────────────────────────────────────────────────────────
let wireframe = false, autoSpin = false;

document.getElementById('btn-wire').addEventListener('click', () => {
  wireframe = !wireframe;
  allMats.forEach(m => m.wireframe = wireframe);
  document.getElementById('btn-wire').textContent = wireframe ? 'Sólido' : 'Wireframe';
});
document.getElementById('btn-spin').addEventListener('click', () => {
  autoSpin = !autoSpin;
  document.getElementById('btn-spin').textContent = autoSpin ? 'Parar' : 'Girar Auto';
});
document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.set(0,1.1,4.5);
  controls.target.set(0,0.95,0);
  controls.update();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Loop ──────────────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  if (autoSpin) character.rotation.y += 0.008;
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
