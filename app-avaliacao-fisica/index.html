<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avaliação Física - Consultoria</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Aplicativo de Avaliação Física</h1>
        <p>Cadastro rápido de alunos com cálculo de IMC e RCQ.</p>
      </header>

      <section class="card">
        <h2>Nova avaliação</h2>
        <form id="assessment-form">
          <div class="grid">
            <label>
              Nome
              <input type="text" id="name" name="name" required />
            </label>
            <label>
              Idade
              <input type="number" id="age" name="age" min="10" max="100" required />
            </label>
            <label>
              Sexo
              <select id="sex" name="sex" required>
                <option value="">Selecione</option>
                <option value="F">Feminino</option>
                <option value="M">Masculino</option>
              </select>
            </label>
            <label>
              Altura (m)
              <input type="number" step="0.01" id="height" name="height" min="1" max="2.5" required />
            </label>
            <label>
              Peso (kg)
              <input type="number" step="0.1" id="weight" name="weight" min="20" max="300" required />
            </label>
            <label>
              Cintura (cm)
              <input type="number" step="0.1" id="waist" name="waist" min="30" max="200" required />
            </label>
            <label>
              Quadril (cm)
              <input type="number" step="0.1" id="hip" name="hip" min="40" max="250" required />
            </label>
          </div>
          <label>
            Observações
            <textarea id="notes" name="notes" rows="3" placeholder="Ex.: dor no joelho, objetivo emagrecimento."></textarea>
          </label>
          <div class="actions">
            <button type="submit">Salvar avaliação</button>
            <button type="button" id="export-csv" class="secondary">Exportar CSV</button>
            <button type="button" id="clear-data" class="danger">Limpar dados</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Avaliações salvas</h2>
        <div id="empty-state">Nenhuma avaliação cadastrada ainda.</div>
        <div class="table-wrap">
          <table id="assessments-table" hidden>
            <thead>
              <tr>
                <th>Data</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>IMC</th>
                <th>Classificação</th>
                <th>RCQ</th>
                <th>Risco</th>
                <th>Obs.</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
